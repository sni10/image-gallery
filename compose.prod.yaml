# Production stack (server: /srv/artai). Values come from .env next to this file (see .env.production.example).
# IMAGE_TAG / FRONT_TAG = backend / frontend commit SHA, written to .env by each repo's deploy/deploy.sh. Only caddy publishes ports: Docker opens
# published ports past ufw, so db and app must never get a `ports:` section.
# Docker logs hold IPs and User-Agents; the privacy policy keeps them at most 30 days. 5 x 20 MB per service covers
# well under 30 days at current traffic; if traffic grows, shrink these rather than keep logs longer.
x-logging: &logging
  driver: local
  options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm  # Postgres 16 + pgvector (PhotoEmbedding)
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  app:
    image: ghcr.io/sni10/image-gallery:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    env_file: .env
    volumes:
      - media:/app/media
      - originals:/app/originals  # clean originals: app only, never mounted into the web server
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  front:
    image: ghcr.io/sni10/image-gallery-front:${FRONT_TAG:?set FRONT_TAG to a frontend commit SHA}
    environment:
      # Server render calls the public API through Caddy (alias below), so image links come back as https://api.artai.win/...
      API_INTERNAL_URL: https://api.artai.win
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8443:8443"  # monitoring (Beszel) on secure.artai.win:8443
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases: [api.artai.win]  # the front container reaches the API via Caddy without leaving the server
    depends_on:
      - app
      - front
    restart: unless-stopped
    logging: *logging

  # Monitoring: https://secure.artai.win:8443 (Caddy). Hub = web UI + history (own login, the first visit creates
  # the admin); the agent reads host and container stats and talks to the hub over a unix socket, no TCP port.
  beszel:
    image: henrygd/beszel:0.21.0
    environment:
      APP_URL: https://secure.artai.win:8443
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    restart: unless-stopped
    logging: *logging

  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    network_mode: host  # host network stats; listens only on the socket below
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY:-}  # hub's public key: UI -> Add system; until it is in .env the agent keeps restarting
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  media:
  originals:
  static:
  caddy_data:
  caddy_config:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
