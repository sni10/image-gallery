# nginx site for the gallery API + admin, used by compose.yaml.
# media/ and staticfiles/ are the app's volumes mounted read-only under /srv/image-gallery;
# Django (gunicorn) runs in the "app" service. nginx serves files directly and proxies the rest.

# Docker's DNS: re-resolve "app" so a recreated container (new IP) doesn't leave nginx proxying to a stale address
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Bulk upload of originals through the admin: many big files in one request
    client_max_body_size 500m;

    # Originals and thumbs. Names are SHA-256 of the content, so a file under a given URL never changes:
    # browsers and CDNs may cache it forever and never revalidate.
    location /media/ {
        alias /srv/image-gallery/media/;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        sendfile on;
        tcp_nopush on;
    }

    # Admin CSS/JS after `manage.py collectstatic`. Names are not hashed, so cache for a limited time.
    location /static/ {
        alias /srv/image-gallery/staticfiles/;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    # API and admin. API responses are not cached: the gallery cover is random per request.
    location / {
        set $app http://app:8000;  # a variable makes nginx resolve at request time via the resolver above
        proxy_pass $app;
        proxy_set_header Host $http_host;  # keeps the port: Django builds absolute image URLs from it
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # bulk uploads are processed inside the request
        gzip on;
        gzip_types application/json;
    }
}
