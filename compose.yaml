# All settings come from .env (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    volumes:
      - media:/app/media
      - originals:/app/originals  # clean originals: app only, never mounted into the web server
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/image-gallery.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/image-gallery/media:ro
      - static:/srv/image-gallery/staticfiles:ro
    depends_on:
      - app
    restart: unless-stopped

  # Development mail catcher: the app sends via SMTP mailpit:1025, read the emails at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  media:
  originals:
  static:
