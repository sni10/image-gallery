[project]
name = "image-gallery"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
]

# Release versions come from Conventional Commits on main (python-semantic-release in CI):
# fix -> patch, feat -> minor, "!" / BREAKING CHANGE -> major (minor while < 1.0). Source of truth: git tags vX.Y.Z.
[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "unittest-xml-reporting>=4.0.0",
]

# CI: `coverage run manage.py test` -> reports in the test-reports artifact (.github/workflows/ci.yml)
[tool.coverage.run]
branch = true
source = ["accounts", "common", "config", "gallery"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
